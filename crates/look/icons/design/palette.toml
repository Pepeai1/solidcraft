light = "#a45000"
dark = "#95682d"

[roles.component-yellow-1]
source = "#e5d99b"
light = "#e5d99b"
dark = "#a9985f"

[roles.component-yellow-2]
source = "#a28200"
light = "#a28200"
dark = "#9a8100"

[roles.component-yellow-3]
source = "#826700"
light = "#826700"
dark = "#857100"

