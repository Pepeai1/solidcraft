# Same accessibility adjustments as the application's semantic UI tokens.
# Protan/Deutan share red-green; Tritan uses blue-yellow. Unlisted roles keep their ramp.
[variants.red-green.sketch.active-3]
light = "#1d7d52"
dark  = "#1d7f89"
# A brighter orange keeps construction distinct from constraint red under both
# red-green loss simulations; the approved normal-vision ramp stays unchanged.
[variants.red-green.construction.active-3]
light = "#b97300"
dark  = "#a75d00"
# The constraint red stays darker than the sketch green for a weak red sense.
[variants.red-green.constraint.active-3]
light = "#af4038"
dark  = "#c16358"
[variants.blue-yellow.construction.active-3]
light = "#b97300"
dark  = "#c37d00"
[variants.blue-yellow.constraint.active-3]
light = "#af4038"
dark  = "#85554a"

# Default accent by requested icon id. Explicit alias accents in aliases.toml win.
# Deliberately not inherited from a master: ground reuses c_fix but is not a constraint.
# Construct/Inspect and shared file/edit utilities retain the base blue in every workspace.
[icon-accents]
surface = [
  "boundary", "blend_surface", "offset_surface", "patch", "reverse_normal",
  "ruled", "stitch", "thicken", "unstitch", "untrim",
]
sketch = [
  "airfoil", "arc3", "arc_center", "arc_slot", "arc_slot_center", "arc_tangent",
  "blend", "circle", "circle2", "circle3", "circle_tt",
  "circle_ttt", "conic", "constrainer", "dimension", "ellipse", "equation_curve",
  "extend", "finish", "fit_section", "include",
  "intersect", "intersection_curve", "iso_curve", "line", "line_mid",
  "offset", "offset_two_sides", "offset_symmetric", "point", "polygon", "polygon_circumscribed", "polygon_edge",
  "project", "project_surface", "rect", "rect3", "rect_center",
  "rect_rounded", "sketch", "sketch_chamfer", "sketch_chamfer_angle", "sketch_chamfer_two_distances",
  "sketch_fillet", "sketch_mirror", "slot", "slot_center", "slot_overall",
  "snap", "spline", "spline_cv", "spun",
  "trim",
]
constraint = [
  "auto_constrain", "c_coincident", "c_collinear", "c_concentric", "c_equal",
  "c_fix", "c_hv", "c_midpoint", "c_parallel", "c_perpendicular",
  "c_polygon", "c_smooth", "c_symmetry", "c_tangent",
]
construction = [
  "centerline", "construction", "construction_line", "construction_line_angle",
  "construction_line_bisector", "construction_line_horizontal", "construction_line_parallel",
  "construction_line_perpendicular", "construction_line_tangent_at", "construction_line_tangent_external",
  "construction_line_tangent_two", "construction_line_vertical", "infinite",
]
mesh = [
  "mesh_body",
]
